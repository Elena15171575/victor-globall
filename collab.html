    <!-- БЛОК С АНИМИРОВАННЫМИ КАРТОЧКАМИ -->
    <div style="background-color: #000000; padding: 80px 20px 120px 20px; width: 100%; box-sizing: border-box; clear: both;">
        
        <h2 style="
            color: #ffffff; 
            text-align: center; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            font-size: 22px; 
            text-transform: uppercase; 
            letter-spacing: 0.25em; 
            margin-bottom: 60px;
            font-weight: 400;
        ">
            Сотрудничество с компаниями
        </h2>

        <style>
            @keyframes card-rose-spin {
                from { transform: translateY(10px) scale(0.6) rotate(0deg); }
                to { transform: translateY(0) scale(1) rotate(360deg); }
            }

            .collab-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 30px;
                max-width: 1200px;
                margin: 0 auto;
            }

            .collab-card {
                background-color: #000000; 
                border: 1px solid #222222; 
                border-radius: 6px;
                padding: 24px;
                text-align: center;
                text-decoration: none;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: space-between;
                min-height: 270px;
                transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
                position: relative;
                box-sizing: border-box;
            }

            .collab-card:hover {
                transform: translateY(-8px); 
                border-color: #e50914; 
                box-shadow: 0 10px 25px rgba(229, 9, 20, 0.15); 
            }

            .collab-title {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
                color: #ffffff;
                font-size: 16px;
                font-weight: 500;
                text-transform: uppercase;
                letter-spacing: 0.1em;
                margin-bottom: 12px;
                transition: color 0.4s ease;
            }

            .collab-card:hover .collab-title {
                color: #ff2e3b; 
            }

            .collab-rose-svg {
                width: 32px;
                height: 32px;
                opacity: 0;
                transform: translateY(10px) scale(0.6);
                transition: opacity 0.4s ease, transform 0.4s ease;
            }

            .collab-card:hover .collab-rose-svg {
                opacity: 1; 
                transform: translateY(0) scale(1);
                animation: card-rose-spin 12s linear infinite;
            }

            .collab-img {
                width: 100%; 
                height: 120px; 
                object-fit: cover; 
                border-radius: 4px; 
                margin-bottom: 20px;
                border: 1px dashed #333333;
                background-color: #050505;
            }
        </style>

        <div class="collab-grid">
            
            <!-- Векторная роза бутоном вверх -->
