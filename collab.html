        <h2 style="

        <style>
            @keyframes card-rose-spin {
                from { transform: translateY(10px) scale(0.6) rotate(0deg); }
                to { transform: translateY(0) scale(1) rotate(360deg); }
            }

            /* ШИРИНА КАРТОЧЕК: увеличили до 340px, чтобы они стали крупными */
            .collab-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
                gap: 30px;
                max-width: 1200px;
                margin: 0 auto;
            }

            /* ВЫСОТА КАРТОЧЕК: сделали строго 360px, чтобы все карточки стояли по линеечке */
            .collab-card {
                background-color: #000000; 
                border: 1px solid #222222; 
                border-radius: 6px;
                padding: 24px;
                text-align: center;
                text-decoration: none;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: space-between;
                height: 360px;
                transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
                position: relative;
                box-sizing: border-box;
            }

            .collab-card:hover {
                transform: translateY(-8px); 
                border-color: #e50914; 
                box-shadow: 0 10px 25px rgba(229, 9, 20, 0.15); 
            }

            .collab-title {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
                color: #ffffff;
                font-size: 16px;
                font-weight: 500;
                text-transform: uppercase;
                letter-spacing: 0.1em;
                margin-top: 15px;
                margin-bottom: 12px;
                transition: color 0.4s ease;
            }

            .collab-card:hover .collab-title {
                color: #ff2e3b; 
            }

            .collab-rose-svg {
                width: 32px;
                height: 32px;
                opacity: 0;
                transform: translateY(10px) scale(0.6);
                transition: opacity 0.4s ease, transform 0.4s ease;
            }

            .collab-card:hover .collab-rose-svg {
                opacity: 1; 
                transform: translateY(0) scale(1);
                animation: card-rose-spin 12s linear infinite;
            }

            /* РАЗМЕР И ВИД КАРТИНКИ: увеличили высоту до 180px, добавили белый фон и отступы */
            .collab-img {
                width: 100%; 
                height: 180px; 
                object-fit: contain; 
                border-radius: 4px; 
                padding: 15px;
                border: 1px solid #111111;
                background-color: #ffffff;
                box-sizing: border-box;
            }
        </style>
