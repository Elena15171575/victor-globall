<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ошибка 404 — Страница не найдена</title>
    <link rel="shortcut icon" href="images/tildafavicon.ico" type="image/x-icon" />
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 20px;
        }
        h1 {
            font-size: 120px;
            margin: 0;
            color: #ff5e00; /* Яркий акцентный цвет */
            font-weight: bold;
            line-height: 1;
        }
        h2 {
            font-size: 24px;
            margin: 10px 0 20px;
        }
        p {
            font-size: 16px;
            color: #888888;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            padding: 15px 30px;
            background-color: #ffffff;
            color: #000000;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            transition: background-color 0.2s ease;
        }
        .btn:hover {
            background-color: #dddddd;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Что-то пошло не так...</h2>
        <p>К сожалению, запрашиваемая страница не существует, удалена или временно недоступна.</p>
        <!-- Ссылка на вашу главную страницу клиента -->
        <a href="index.html" class="btn">Вернуться на главную</a>
    </div>
</body>
</html>
