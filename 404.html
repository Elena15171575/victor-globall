<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Страница не найдена | VG WEB SITE</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0c0d; /* Фирменный глубокий тёмный фон */
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px;
        }
        .wrapper {
            max-width: 600px;
        }
        .brand-header {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #888888;
            margin-bottom: 40px;
        }
        .error-title {
            font-size: 100px;
            font-weight: 300;
            line-height: 1;
            letter-spacing: -0.03em;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 24px;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 16px;
        }
        p {
            font-size: 16px;
            color: #aaaaaa;
            line-height: 1.6;
            margin-bottom: 48px;
            font-weight: 300;
        }
        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }
        .btn-main {
            display: inline-block;
            background-color: #e50914; /* Красный цвет кнопки */
            color: #ffffff;
            text-decoration: none;
            padding: 14px 36px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 600;
            border-radius: 4px;
            transition: background-color 0.3s ease;
        }
        .btn-main:hover {
            background-color: #b80710; /* Темно-красный при наведении */
        }
        .btn-secondary {
            color: #888888;
            text-decoration: none;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: color 0.3s ease;
            margin-top: 8px;
        }
        .btn-secondary:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="brand-header">VG WEB SITE / REBORN</div>
        <div class="error-title">404</div>
        <h1>Кажется, здесь пусто</h1>
        <p>Искусство требует точных путей. Эта страница не существует, была перенесена или в её адресе закралась ошибка.</p>
        
        <div class="nav-links">
            <!-- Ссылка ведет строго на главную страницу вашего проекта -->
            <a href="/victor-globall/" class="btn-main">Вернуться на главную</a>
            <!-- Ссылка на раздел контактов внутри вашего проекта -->
            <a href="/victor-globall/contacts.html" class="btn-secondary">Контакты</a>
        </div>
    </div>

</body>
</html>
